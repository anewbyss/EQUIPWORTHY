# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
name: EquipWorthy
options:
  bundleIdPrefix: com.equipworthy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  EquipWorthyKit:
    path: EquipWorthyKit
targets:
  EquipWorthy:
    type: application
    platform: iOS
    sources:
      - EquipWorthy
    dependencies:
      - package: EquipWorthyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.equipworthy.tracking
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: EquipWorthy
        INFOPLIST_KEY_NSCameraUsageDescription: EquipWorthy uses the camera to scan and identify Magic cards.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: EquipWorthy can identify cards from photos you choose.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: EquipWorthy/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers:
          - com.equipworthy.refresh
        UIBackgroundModes:
          - fetch
        ITSAppUsesNonExemptEncryption: false
schemes:
  EquipWorthy:
    build:
      targets:
        EquipWorthy: all
